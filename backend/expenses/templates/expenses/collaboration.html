<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel together · Numi</title>
<style>{% include "expenses/vendor/leaflet.css" %}</style>
<style>
#map-canvas{height:420px;border-radius:14px;isolation:isolate;color:#202b27}#map-canvas[hidden]{display:none}.numi-map-pin{background:#24634a;border:3px solid white;border-radius:50%;color:white;text-align:center;line-height:26px;font-weight:bold;box-shadow:0 1px 5px #0005}.numi-map-pin.chosen{background:#bd510c}.leaflet-control-attribution a{color:#24634a}#map-distance{margin:12px 0}dialog{z-index:2000}

:root{color-scheme:light dark;--bg:#f5f5f1;--panel:#fff;--ink:#202b27;--muted:#68756e;--line:#dee4df;--accent:#24634a;--soft:#eaf2ec;--danger:#a82a35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1100px;margin:auto;padding:44px 24px 80px}h1{font-size:36px;letter-spacing:-1.2px;margin:8px 0}h2{font-size:20px;margin:0 0 18px}h3{font-size:16px;margin:0}p{margin:8px 0}button,input,select,textarea{font:inherit}button,a.button{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none}button:hover,a.button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}button.danger{color:var(--danger)}button.active{background:var(--soft);color:var(--accent);border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:var(--accent)}.header{margin-bottom:28px}.peoplebar{padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0}.chip{display:inline-block;border-radius:30px;background:var(--soft);color:var(--accent);font-size:12px;padding:4px 10px}.tabs{margin:24px 0 18px}.filters{margin:18px 0;display:flex;gap:14px;flex-wrap:wrap}.filters label{min-width:160px;flex:1}.filters select{margin-top:5px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:12px 0}.card .notes{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin-top:12px}.card .actions{margin-top:16px}.time{font-size:13px;color:var(--accent);font-weight:600}.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.status{font-size:12px;color:var(--muted);min-height:22px;margin-top:12px}.error{color:var(--danger);white-space:pre-wrap}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:700px;width:calc(100% - 28px);padding:26px;max-height:90vh}dialog::backdrop{background:#10241b80;backdrop-filter:blur(3px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}label{display:block;font-size:13px;color:var(--muted)}input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;padding:10px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;margin-top:4px;min-height:42px}textarea{min-height:96px;resize:vertical}fieldset{border:1px solid var(--line);border-radius:9px;margin:0;padding:12px}fieldset label{color:var(--ink);margin:5px}.footer{margin-top:24px;justify-content:flex-end}.link{color:var(--accent)}.history-item{border-top:1px solid var(--line);padding:14px 0}.conflict{padding:14px;background:var(--soft);border-radius:10px;margin:10px 0;overflow-wrap:anywhere}details{margin-top:12px}summary{cursor:pointer}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--panel);padding:12px 22px;border-radius:12px;z-index:10}.readonly{font-size:12px;color:var(--muted)}@media(max-width:600px){main{padding:24px 16px}h1{font-size:30px}.grid{grid-template-columns:1fr}.card{padding:16px}.filters label{min-width:120px}dialog{padding:20px}.header>.row{align-items:flex-start}}@media(prefers-color-scheme:dark){:root{--bg:#15211c;--panel:#1e2c25;--ink:#e3ebe5;--muted:#a4b7aa;--line:#34473c;--accent:#9bd2ae;--soft:#2b4435;--danger:#ffabb0}button.primary{background:#4d9268;color:#fff;border-color:#4d9268}}
</style></head><body><main>
<div class="header"><span class="eyebrow">Numi / Travel together</span><div class="row between"><div><h1 id="title">Shared itinerary</h1><p id="dates" class="muted">Opening your trip…</p></div><div class="row" id="tools"></div></div><div id="status" class="status" role="status"></div></div>
<div id="workspace" hidden><div class="peoplebar row between"><div class="row" id="people"></div><button data-action="people">Manage people</button></div>
<nav id="tabs" class="tabs row" aria-label="Trip sections"></nav><div class="filters"><label id="day-label">Day<select id="day"></select></label><label>Show people<select id="person"></select></label><label>Destination<select id="destination"></select></label></div><div class="row between"><h2 id="section"></h2><div id="add" class="row"></div></div><section id="map-panel" hidden><div class="row between"><label><input id="map-saved" type="checkbox" checked> Saved places</label><span id="map-count" class="muted"></span><button id="map-fit">Fit all places</button></div><p id="map-distance" class="muted"></p><div id="map-canvas" aria-label="Trip places map"></div><p id="map-empty" class="empty">No mapped places in this view. Use Locate below or import a Google Maps place link.</p><p id="map-error" class="error" hidden>Map tiles unavailable. Place details and distances still work.</p></section><div id="cards"></div></div>
</main><div id="toast" hidden class="toast" role="status"></div>{{ boot|json_script:"boot" }}
<script>{% include "expenses/vendor/leaflet.js" %}</script>
<script>
(()=>{'use strict';
const boot=JSON.parse(document.getElementById('boot').textContent), $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null, tab='Itinerary', selectedDay='', person='', destination='', refreshing=false, lastActor='';
const id=()=>crypto.randomUUID().replaceAll('-',''), list=()=>state?.content.items||[], people=()=>list().filter(i=>i.kind==='person'), activePeople=()=>people().filter(p=>!['cancelled','skipped'].includes(p.status)), editable=()=>state&&state.role!=='viewer';
const title=i=>i.title||list().find(p=>p.id===i.placeId)?.title||'Activity';
const personLabel=i=>i.participantIds?.length?i.participantIds.map(p=>people().find(x=>x.id===p)?.title||'Archived person').join(', '):'Everyone';
const selectedPeople=i=>!person||(i.participantIds?.length?i.participantIds.includes(person):!['cancelled','skipped'].includes(people().find(p=>p.id===person)?.status));
const chip=v=>`<span class="chip">${esc(v)}</span>`;
function toast(v){$('#toast').textContent=v;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4500)}
function csrf(){return document.cookie.split('; ').find(c=>c.startsWith('csrftoken='))?.split('=')[1]||''}
async function request(path,body,method){const r=await fetch(boot.api+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},...(body?{body:JSON.stringify(body)}:{})});let data;try{data=await r.json()}catch{throw Error('Could not connect. Try again.')}if(!r.ok)throw Object.assign(Error(data.error||'Could not save'),{status:r.status,data});return data}
function modal(heading,html){const d=document.createElement('dialog');d.innerHTML=`<div class="row between"><h2>${esc(heading)}</h2><button type="button" data-close aria-label="Close">×</button></div>${html}`;document.body.append(d);d.querySelector('[data-close]').onclick=()=>d.close();d.onclose=()=>d.remove();d.showModal();return d}
function options(rows,current){return rows.map(([v,t])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(t)}</option>`).join('')}
function dates(){const result=new Set();for(let d=new Date(state.trip.start_date+'T12:00:00Z'),end=new Date(state.trip.end_date+'T12:00:00Z');d<=end&&result.size<1000;d.setUTCDate(d.getUTCDate()+1))result.add(d.toISOString().slice(0,10));list().forEach(i=>{if(['activity','booking'].includes(i.kind)){if(i.date)result.add(i.date);if(i.endDate)result.add(i.endDate)}});return [...result].sort()}
function render(){if(!state)return;$('#workspace').hidden=false;$('#title').textContent=state.trip.destination;$('#dates').textContent=`${state.trip.start_date} — ${state.trip.end_date}`;
$('#tools').innerHTML=`${editable()?'<button data-action="pdf">Import PDF</button>':''}${!boot.shared?'<a class="button" href="/expenses/travel/">Spending ↗</a><button data-action="invites">Invite</button>':''}<button data-action="history">History</button>${boot.shared?'<button data-action="leave">Leave</button>':''}`;
$('#people').innerHTML='<span class="muted">Travellers</span> '+(activePeople().map(p=>chip(p.title)).join(' ')||'<span class="muted">Add the people joining this trip</span>');
$('#tabs').innerHTML=['Itinerary','Map','Saved places','Checklist'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}" aria-pressed="${tab===t}">${t}</button>`).join('');
if(person&&!people().some(p=>p.id===person))person='';$('#person').innerHTML=options([['','Everyone’s itinerary'],...(state.person_id&&people().some(p=>p.id===state.person_id)?[[state.person_id,'My itinerary']]:[]),...people().map(p=>[p.id,p.title+(['cancelled','skipped'].includes(p.status)?' (archived)':'')])],person);
$('#destination').innerHTML=options([['','All destinations'],...list().filter(i=>i.kind==='destination').map(i=>[i.id,i.title])],destination);
$('#day-label').hidden=!['Itinerary','Map'].includes(tab);$('#day').innerHTML=options([['',tab==='Map'?'Whole trip':'Unscheduled'],...dates().map(d=>[d,d])],selectedDay);$('#section').textContent=tab==='Itinerary'?(selectedDay||'Unscheduled'):tab;
$('#map-panel').hidden=tab!=='Map';if(tab==='Map'){$('#add').innerHTML='';renderMap();return;}
$('#add').innerHTML=!editable()?'<span class="readonly">View-only invitation</span>':(tab==='Itinerary'?'<button data-add="activity" class="primary">＋ Activity</button><button data-add="booking">＋ Transport / stay</button>':tab==='Saved places'?'<button class="primary" data-add="place">＋ Place</button>':'<button class="primary" data-add="task">＋ Task</button>');
let rows=list().filter(i=>tab==='Saved places'?i.kind==='place':tab==='Checklist'?i.kind==='task':(i.kind==='activity'&&(i.date||'')===selectedDay)||(i.kind==='booking'&&selectedDay&&(i.date===selectedDay||i.endDate===selectedDay||(i.category==='Accommodation'&&i.date<selectedDay&&i.endDate>selectedDay))));
rows=rows.filter(i=>selectedPeople(i)&&(!destination||(i.destinationId||list().find(p=>p.id===i.placeId)?.destinationId)===destination||i.endDestinationId===destination));
const time=i=>i.endDate===selectedDay&&i.date!==selectedDay?i.endTime:i.time;rows.sort((a,b)=>(time(a)||'99:99').localeCompare(time(b)||'99:99'));
$('#cards').innerHTML=rows.map(i=>{const place=list().find(p=>p.id===i.placeId);return `<article class="card"><div class="row between"><span class="time">${esc(time(i)||'Flexible time')} · ${esc(i.category||i.kind)}</span>${['activity','booking'].includes(i.kind)?chip(personLabel(i)):''}</div><h3>${esc(title(i))}</h3>${i.endDate?`<p class="muted">${esc(i.date)} ${esc(i.time)} → ${esc(i.endDate)} ${esc(i.endTime)}</p>`:''}${i.address||i.endAddress?`<p>${esc(i.address||'')}${i.endAddress?' → '+esc(i.endAddress):''}</p>`:''}${i.timezone?`<p class="muted">Local times · ${esc(i.timezone)}${i.endTimezone?' → '+esc(i.endTimezone):''}</p>`:''}${i.confirmation?`<p>Confirmation: ${esc(i.confirmation)}</p>`:''}${i.documentId?`<p><a class="button" href="${esc(boot.api+'documents/'+encodeURIComponent(i.documentId)+'/')}" target="_blank" rel="noopener noreferrer">PDF · ${esc(i.documentName||'Original ticket')} ↗</a></p>`:''}<p class="notes">${esc(i.notes||place?.notes||'')}</p><div class="row">${[...(place?.links||[]),...(i.links||[])].filter(l=>/^https?:\/\//.test(l.url)).map(l=>`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||l.purpose||'Link')} ↗</a>`).join('')}</div>${editable()?`<div class="row actions"><button data-edit="${esc(i.id)}">Edit</button>${i.kind==='place'?`<button data-schedule="${esc(i.id)}">Add to itinerary</button>`:''}<button class="danger" data-delete="${esc(i.id)}">Remove</button></div>`:''}</article>`}).join('')||'<div class="empty">Nothing here yet. Add an arrangement or choose another day.</div>';
}
async function refresh(){if(refreshing)return;refreshing=true;try{const next=await request('data/');if(!state)selectedDay=next.trip.start_date;const changed=state&&state.revision!==next.revision;state=next;$('#status').textContent=`${state.actor} · ${state.role==='viewer'?'View only':'Changes saved automatically'}${changed?' · Updated from another device':''}${lastActor?' · '+lastActor:''}`;$('#status').classList.remove('error');if(!document.querySelector('dialog'))render()}catch(e){$('#status').textContent=e.message;$('#status').classList.add('error');if(e.status===403){state=null;$('#workspace').hidden=true;document.querySelectorAll('dialog').forEach(d=>d.close())}}finally{refreshing=false}}
const pendingMutations=new Map();
async function save(operations,revision=state.revision){const key=JSON.stringify({operations,revision});if(!pendingMutations.has(key))pendingMutations.set(key,id());const result=await request('data/',{operations,revision,mutation_id:pendingMutations.get(key)});pendingMutations.delete(key);state=result;render();return result}
async function submit(operations,revision,onDone){try{await save(operations,revision);onDone?.();toast('Saved')}catch(e){if(e.status===409){await conflicts(operations,e.data.conflicts||[],onDone)}else throw e}}
async function conflicts(operations,fields,onDone){const next=await request('data/');state=next;const d=modal('Review overlapping changes',`<p class="muted">Other people changed these fields while you were editing. Your other changes are kept.</p>${fields.map((f,n)=>`<fieldset class="conflict"><legend>${esc(list().find(i=>i.id===f.id)?.title||'Arrangement')} · ${esc(f.field==='*'?'Item':f.field)}</legend><label><input type="radio" name="conflict-${n}" value="remote" checked> Keep latest: ${esc(JSON.stringify(f.remote))}</label><label><input type="radio" name="conflict-${n}" value="local"> Use my change: ${esc(JSON.stringify(f.local))}</label></fieldset>`).join('')}<p class="error" role="alert"></p><div class="row footer"><button data-cancel>Cancel</button><button class="primary" data-resolve>Save selected changes</button></div>`);
d.querySelector('[data-cancel]').onclick=()=>d.close();d.querySelector('[data-resolve]').onclick=async()=>{const ops=structuredClone(operations);fields.forEach((f,n)=>{if(d.querySelector(`[name="conflict-${n}"]:checked`).value==='remote'){const at=ops.findIndex(o=>o.id===f.id);if(at>=0){if(f.field==='*'||!ops[at].changes)ops.splice(at,1);else delete ops[at].changes[f.field]}}});try{if(ops.length)await save(ops,next.revision);d.close();onDone?.();toast('Saved')}catch(e){d.querySelector('.error').textContent=e.message}}}
const field=(key,label,value='',type='text')=>`<label>${esc(label)}<input name="${key}" value="${esc(value)}" type="${type}" maxlength="${key==='title'?500:10000}"></label>`;
function editor(initial,pdf=null){if(!editable())return;const item=structuredClone(initial), revision=state.revision, arrangement=['activity','booking'].includes(item.kind), booking=item.kind==='booking';
let html=`${field('title','Name',item.title)}${item.kind==='person'?'':item.kind==='booking'?`<label>Arrangement type<select name="category">${options(['Accommodation','Flight','Train','Bus','Car rental','Reservation','No accommodation needed'].map(v=>[v,v]),item.category)}</select></label>`:field('category','Category',item.category)}`;
if(!['person','place'].includes(item.kind)){html+=field('date',item.kind==='activity'?'Day (empty = unscheduled)':'Start day',item.date,'date');if(booking||item.kind==='destination')html+=field('endDate','End / checkout day',item.endDate,'date')}
if(arrangement)html+=field('time','Start time (local)',item.time,'time')+field('endTime','End time (local)',item.endTime,'time');
if(booking)html+=field('timezone','Start time zone',item.timezone)+field('endTimezone','End time zone',item.endTimezone);
if(!['person','task'].includes(item.kind))html+=field('address','Address / departure',item.address)+(booking?field('endAddress','Arrival',item.endAddress)+field('confirmation','Confirmation / flight number',item.confirmation):'');
if(!['person','destination'].includes(item.kind))html+=`<label>Destination<select name="destinationId">${options([['','Unassigned'],...list().filter(i=>i.kind==='destination').map(i=>[i.id,i.title])],item.destinationId||'')}</select></label>`;
html+=`<label>Status<select name="status">${options((item.kind==='person'?['planned','cancelled']:item.kind==='task'?['todo','completed']:['planned','confirmed','completed','skipped','cancelled']).map(v=>[v,item.kind==='person'?(v==='planned'?'Active':'Archived'):v]),item.status||'planned')}</select></label>`;
if(arrangement)html+=`<fieldset class="wide"><legend>Participants</legend><label><input type="checkbox" name="everyone" ${!item.participantIds?.length?'checked':''}> Everyone (includes people added later)</label><div data-members>${people().map(p=>`<label><input type="checkbox" name="person" value="${esc(p.id)}" ${item.participantIds?.includes(p.id)?'checked':''}> ${esc(p.title)}${['cancelled','skipped'].includes(p.status)?' (archived)':''}</label>`).join('')||'<p class="muted">Add travellers from Manage people.</p>'}</div></fieldset>`;
if(arrangement)html+=`<div class="wide"><button type="button" data-attach-pdf>Attach / replace PDF</button><p data-pdf-name class="muted">${esc(pdf?.file.name||item.documentName||'Original tickets are shared with invited trip members.')}</p></div>`;
if(item.kind!=='person')html+=`<label class="wide">Shared notes<textarea name="notes" maxlength="10000">${esc(item.notes||'')}</textarea></label><label class="wide">Links (one URL per line)<textarea name="urls">${esc((item.links||[]).map(l=>l.url).join('\n'))}</textarea></label>`;
const d=modal(item.kind==='person'?'Traveller':list().some(i=>i.id===item.id)?'Edit arrangement':'Add '+item.kind,`<form><div class="grid">${html}</div><p class="error" role="alert"></p><div class="row footer"><button type="button" data-cancel>Cancel</button><button class="primary" type="submit">Save</button></div></form>`);d.querySelector('[data-cancel]').onclick=()=>d.close();
d.querySelector('[data-attach-pdf]')?.addEventListener('click',()=>{const input=document.createElement('input');input.type='file';input.accept='application/pdf,.pdf';input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>10*1024*1024){d.querySelector('.error').textContent='PDF must be at most 10 MB.';return;}pdf={...pdf,file};d.querySelector('[data-pdf-name]').textContent=file.name;};input.click();});
const all=d.querySelector('[name=everyone]');const toggle=()=>{d.querySelectorAll('[name=person]').forEach(x=>x.disabled=all.checked)};if(all){all.onchange=toggle;toggle()}
d.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=d.querySelector('[type=submit]');button.disabled=true;try{const form=new FormData(e.target), changes={};for(const [key,val]of form){if(!['everyone','person','urls'].includes(key)&&String(val)!==(item[key]||''))changes[key]=String(val)}if(!(changes.title??item.title)?.trim()&&!item.placeId)throw Error('Enter a name.');if(arrangement){const ids=all.checked?[]:form.getAll('person');if(!all.checked&&!ids.length)throw Error('Select at least one person, or Everyone.');if(JSON.stringify(ids)!==JSON.stringify(item.participantIds||[]))changes.participantIds=ids}
if(form.has('urls')){const urls=String(form.get('urls')).split('\n').map(v=>v.trim()).filter(Boolean);if(urls.some(u=>{try{const x=new URL(u);return !['https:','http:'].includes(x.protocol)||!!x.username}catch{return true}}))throw Error('Links must use https:// or http://');if(JSON.stringify(urls)!==JSON.stringify((item.links||[]).map(l=>l.url)))changes.links=urls.map(url=>(item.links||[]).find(l=>l.url===url)||{purpose:'Other',label:'',url})}
if(pdf){const document=await pdfRequest('documents/',pdf.file);changes.documentId=document.id;changes.documentName=document.name;}
const existed=list().some(i=>i.id===item.id);await submit([{id:item.id,changes:existed?changes:{...item,...changes}}],revision,()=>{d.close();pdf?.onSaved?.()})}catch(e){d.querySelector('.error').textContent=e.message}finally{button.disabled=false}}}
function newItem(kind,fields={}){return{id:id(),kind,title:'',status:kind==='task'?'todo':'planned',category:kind==='booking'?'Accommodation':kind==='place'?'Sightseeing':kind==='person'?'Person':kind==='task'?'Preparation':'Activity',links:[],...(['booking','activity'].includes(kind)?{date:selectedDay||state.trip.start_date}:{}),...fields}}
function managePeople(){const d=modal('Travellers',`<p class="muted">Everyone means all active travellers. Archive a person to keep their past arrangements.</p>${people().map(p=>`<div class="row between history-item"><span>${esc(p.title)} ${['cancelled','skipped'].includes(p.status)?'(archived)':''}</span>${editable()?`<button data-person="${esc(p.id)}">Edit</button>`:''}</div>`).join('')}${editable()?'<div class="footer row"><button class="primary" data-new-person>＋ Add traveller</button></div>':''}`);d.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const p=list().find(i=>i.id===b.dataset.person);d.close();editor(p)});d.querySelector('[data-new-person]')?.addEventListener('click',()=>{d.close();editor(newItem('person'))})}
async function invitations(){const data=await request('invites/');const d=modal('Invite to this trip',`<p class="muted">Links grant access to this trip only and expire after 30 days. The name identifies edits; anyone holding the link can use it.</p><form class="grid">${field('name','Name of invited person')}<label>Permission<select name="role"><option value="editor">Can edit</option><option value="viewer">Can view</option></select></label><label>Link to traveller<select name="person_id">${options([['','Helping plan, not travelling'],...activePeople().map(p=>[p.id,p.title])],'')}</select></label><div class="footer row"><button class="primary" type="submit">Create invitation</button></div></form><p class="error"></p><div data-created></div><h3>Invitations</h3>${data.invites.map(i=>`<div class="row between history-item"><span>${esc(i.name)} · ${esc(i.role)}<br><small class="muted">${i.revoked_at?'Revoked':'Expires '+i.expires_at.slice(0,10)}</small></span>${!i.revoked_at?`<button data-revoke="${i.id}">Revoke</button>`:''}</div>`).join('')}`);
d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const result=await request('invites/',Object.fromEntries(new FormData(e.target)));d.querySelector('[data-created]').innerHTML=`<label>Copy this invitation link<input readonly value="${esc(result.url)}"></label><button data-copy>Copy link</button><p class="muted">The link is shown only now. It has not been sent to anyone.</p>`;d.querySelector('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(result.url);toast('Link copied')}catch{d.querySelector('[data-created] input').select()}}}catch(e){d.querySelector('.error').textContent=e.message}};d.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{try{await request('invites/',{id:Number(b.dataset.revoke)},'DELETE');b.textContent='Revoked';b.disabled=true}catch(e){d.querySelector('.error').textContent=e.message}})}
async function history(){const data=await request('history/');const d=modal('Change history',`<p class="muted">Restore an individual arrangement without replacing the rest of the trip.</p>${data.changes.map((c,n)=>`<div class="history-item"><strong>${esc(c.actor)}</strong> <span class="muted">· ${esc(new Date(c.created_at).toLocaleString())} · v${c.revision}</span><details><summary>View arrangements</summary>${c.content.items.map(i=>`<div class="row between history-item"><span>${esc(i.title||i.kind)}</span>${editable()?`<button data-restore="${n}" data-id="${esc(i.id)}">Restore</button>`:''}</div>`).join('')}</details></div>`).join('')||'<p>No changes yet.</p>'}<p class="error"></p>`);d.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{if(!confirm('Restore this arrangement from the selected version?'))return;const item=data.changes[Number(b.dataset.restore)].content.items.find(i=>i.id===b.dataset.id);try{await submit([{id:item.id,changes:item,replace:true}],state.revision,()=>d.close())}catch(e){d.querySelector('.error').textContent=e.message}})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.add)editor(newItem(b.dataset.add));else if(b.dataset.edit)editor(list().find(i=>i.id===b.dataset.edit));else if(b.dataset.schedule){const p=list().find(i=>i.id===b.dataset.schedule);editor(newItem('activity',{placeId:p.id,title:p.title,destinationId:p.destinationId||''}))}else if(b.dataset.delete){if(confirm('Remove this arrangement? Any recorded payment stays in your ledger.'))await submit([{id:b.dataset.delete,delete:true}],state.revision)}else if(b.dataset.action==='pdf')await importPdf();else if(b.dataset.action==='people')managePeople();else if(b.dataset.action==='invites')await invitations();else if(b.dataset.action==='history')await history();else if(b.dataset.action==='leave'){await request('session/',{},'DELETE');state=null;location.reload()}}catch(e){toast(e.message)}});
$('#day').onchange=e=>{selectedDay=e.target.value;render()};$('#person').onchange=e=>{person=e.target.value;render()};$('#destination').onchange=e=>{destination=e.target.value;render()};

async function start(){const token=new URLSearchParams(location.hash.slice(1)).get('invite');if(token&&boot.shared){window.history.replaceState(null,'',location.pathname);try{await request('session/',{token})}catch(e){$('#status').textContent=e.message;return}}await refresh()}
start();setInterval(()=>{if(!document.hidden&&!document.querySelector('dialog'))void refresh()},12000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.querySelector('dialog'))void refresh()});
})();
</script></body></html>
