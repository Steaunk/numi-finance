<script>

    const expenseCategories = ['Transportation','Accommodation','Sightseeing','Food & Drinks','Shopping','Other'];
    const expenseCategory = category => category === 'Accommodation' ? 'Accommodation' : ['Flight','Train','Bus','Car rental'].includes(category) ? 'Transportation' : ['Sightseeing','Shopping'].includes(category) ? category : ['Restaurant','Cafe'].includes(category) ? 'Food & Drinks' : 'Other';
    const priorities = ['Must go','If nearby','Nice to have'];
    const statuses = ['planned','confirmed','completed','skipped','cancelled'];
    const purposes = ['Map','Website','Booking','Guide','Other'];
    const states = new Map(), running = new Map();
    const id = () => crypto.randomUUID().replaceAll('-','');

    const empty = () => ({content:{items:[]},revision:0,mutation:'',dirty:false,error:''});
    const read = tripId => JSON.parse(localStorage.getItem(key(tripId)) || 'null') || empty();
    const write = (tripId, row) => localStorage.setItem(key(tripId), JSON.stringify(row));
    const items = s => read(s.trip.id).content.items;
    const kind = (s,k) => items(s).filter(i => i.kind === k);
    const cancelled = i => ['cancelled','skipped'].includes(i.status);
    const title = (s,i) => i.title || items(s).find(p => p.id === i.placeId)?.title || 'Activity';
    function days(trip) {

    }
    function select(name,values,value,label) { return `<label>${escape(label)}<select data-filter="${name}">${values.map(v=>`<option value="${escape(v)}" ${v === value ? 'selected' : ''}>${escape(v || 'Unassigned')}</option>`).join('')}</select></label>`; }

        root.querySelector('.plan-tabs').innerHTML = tabs.map(t=>`<button class="btn ${s.tab===t?'active':'btn-secondary'}" data-tab="${t}" role="tab" aria-selected="${s.tab===t}">${t}</button>`).join('');

            html = `<h3>${phase(s.trip)}</h3><p class="plan-muted">${escape(s.trip.start_date)} — ${escape(s.trip.end_date)} · ${list.filter(i=>!['task','destination'].includes(i.kind)).length} planned · ${tasks.filter(i=>i.status==='completed').length}/${tasks.length} prepared</p><h3>${day === today() ? 'Today' : 'Itinerary'} · ${day}</h3>`;
            const current = [...bookingsOn(s,day),...kind(s,'activity').filter(i=>i.date===day)];
            html += current.length ? current.filter(i=>inDestination(s,i)).map(i=>card(s,i,false,day)).join('') : '<p class="plan-muted">Nothing scheduled yet. Save places or add an activity.</p>';
            const upcoming = kind(s,'booking').filter(i=>!cancelled(i) && i.date > day).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
            if(upcoming.length) html += '<h3>Upcoming bookings</h3>'+upcoming.map(i=>card(s,i)).join('');
            const deadlines = kind(s,'booking').filter(i=>!cancelled(i) && i.cancelBy >= today()).sort((a,b)=>a.cancelBy.localeCompare(b.cancelBy));
            if(deadlines.length) html += '<h3>Cancellation deadlines</h3>'+deadlines.slice(0,5).map(i=>`<p class="plan-muted">${escape(i.cancelBy)} · ${escape(i.title)}</p>`).join('');
            html += '<h3>Before you go</h3>'+(tasks.filter(i=>i.status!=='completed').slice(0,5).map(i=>card(s,i)).join('') || '<p class="plan-muted">All preparation items are complete.</p>');

            const filtered = kind(s,'place').filter(i=>inDestination(s,i)).filter(i=>(s.category==='All'||i.category===s.category)&&(s.priority==='All'||i.priority===s.priority)&&(s.scheduled==='All'||(s.scheduled==='Scheduled')===kind(s,'activity').some(a=>a.placeId===i.id && a.date && !cancelled(a))));

    function change(s,fn) {

    async function copy(value) { try { await navigator.clipboard.writeText(value); showMessage('Link copied','success'); } catch { prompt('Copy this link:',value); } }

    function editor(s,initial) {

        const input = (name,label,type='text',required=false) => `<label>${escape(label)}<input name="${name}" type="${type}" value="${escape(item[name]||'')}" ${required?'required':''} maxlength="${name==='notes'?10000:500}"></label>`;
        const choice = (name,label,values) => `<label>${escape(label)}<select name="${name}">${values.map(v=>`<option ${v===item[name]?'selected':''} value="${escape(v)}">${escape(v)}</option>`).join('')}</select></label>`;
        let fields = input('title','Name (optional for a linked activity)','text',item.kind!=='activity');
        if(categories[item.kind]) fields += choice('category',item.kind==='task'?'Checklist':'Category',categories[item.kind]);
        if(item.kind==='place') fields += choice('priority','Priority',priorities);
        if(['place','activity','booking'].includes(item.kind)&&destinations(s).length) fields += `<label data-destination-field>Destination<select name="destinationId">${destinationOptions(s,item.destinationId,'Unassigned')}</select></label>`;
        if(item.kind==='booking'&&destinations(s).length) fields += `<label data-arrival-destination-field>To destination<select name="endDestinationId">${destinationOptions(s,item.endDestinationId,'Unassigned')}</select></label>`;
        if(item.kind==='destination') fields += '<p class="plan-muted wide">Visit dates may overlap with another destination on transfer days.</p>';
        fields += choice('status','Status',item.kind==='task'?['todo','completed']:statuses);
        if(item.kind==='activity') fields += `<label>Saved place<select name="placeId"><option value="">No linked place</option>${kind(s,'place').map(p=>`<option value="${escape(p.id)}" ${p.id===item.placeId?'selected':''}>${escape(p.title)}</option>`).join('')}</select></label>`;
        if(item.kind==='booking') fields += '<h3 class="wide" data-stay-heading>Stay duration</h3>';
        if(item.kind!=='place') fields += input('date',item.kind==='task'?'Due date':item.kind==='activity'?'Day (empty = unassigned)':item.kind==='destination'?'Arrival date':'Start / check-in / night','date',['booking','destination'].includes(item.kind));
        if(item.kind==='destination') fields += input('endDate','Departure date','date',true);
        if(item.kind==='booking') fields += input('endDate','Arrival / check-out date','date')+'<p class="plan-muted wide" data-stay-duration aria-live="polite"></p>';
        if(['booking','activity'].includes(item.kind)) fields += input('time','Start time (empty = flexible)','time')+input('endTime','End time','time');
        if(item.kind==='booking') fields += input('timezone','Start time zone')+input('endTimezone','Arrival time zone');
        if(item.kind!=='task') fields += input('address','Address / departure');
        if(item.kind==='booking') fields += input('endAddress','Arrival address')+input('confirmation','Confirmation / flight / train number')+input('contact','Contact')+input('cancelBy','Cancellation deadline','date');
        if(['booking','activity'].includes(item.kind) && item.category!=='No accommodation needed') {
            fields += '<h3 class="wide">Payment</h3>'+input('amount','Amount (optional until paid)')+input('currency','Currency')+
                choice('paymentStatus','Payment status',['unpaid','paid'])+input('paidDate','Payment date','date')+
                choice('expenseCategory','Expense category',expenseCategories)+
                '<p class="plan-muted wide">Paid itinerary items appear in expenses automatically. Enter the payment once here.</p>';
        }
        if(item.kind==='task') fields += input('assignee','Responsible person');
        fields += `<label class="wide">Notes<textarea name="notes" maxlength="10000">${escape(item.notes||'')}</textarea></label>`;
        dialog.innerHTML = `<form><h2>${initial.title ? 'Edit' : 'Add'} ${item.kind==='task'?'checklist item':item.kind}</h2><div class="form-grid">${fields}</div><p class="plan-muted">All times are local; there is no automatic time-zone conversion.</p>${item.kind!=='task'?'<h3>External links</h3><div class="link-rows"></div><label>URL or share text<textarea class="share-text" placeholder="Paste links or a shared post"></textarea></label><div class="link-preview plan-muted"></div><button class="btn btn-secondary" type="button" data-import>Add detected links</button>':''}<p class="plan-notice" role="alert"></p><div class="plan-actions"><button class="btn btn-primary" type="submit">Save item</button><button class="btn btn-secondary" type="button" data-close>Cancel</button></div></form>`;
        document.body.append(dialog); dialog.showModal();
        dialog.addEventListener('close',()=>dialog.remove()); dialog.querySelector('[data-close]').onclick=()=>dialog.close();
        const form = dialog.querySelector('form'), error = dialog.querySelector('[role=alert]');
        function updateDestinationFields() {
            const linked=!!form.elements.placeId?.value;
            const transport=item.kind==='booking'&&['Flight','Train','Bus','Car rental'].includes(form.elements.category.value);
            const source=form.querySelector('[data-destination-field]'),arrival=form.querySelector('[data-arrival-destination-field]');
            if(source){source.hidden=linked;source.firstChild.textContent=transport?'From destination':'Destination';}
            if(arrival)arrival.hidden=!transport;
        }
        updateDestinationFields();
        form.addEventListener('change',updateDestinationFields);
        function updateStayDuration() {
            if(item.kind!=='booking') return;
            const stay=form.elements.category.value==='Accommodation';
            const heading=form.querySelector('[data-stay-heading]'), summary=form.querySelector('[data-stay-duration]');
            heading.hidden=summary.hidden=!stay;
            form.elements.date.parentElement.firstChild.textContent=stay?'Check-in date':'Start date / night';
            form.elements.endDate.parentElement.firstChild.textContent=stay?'Check-out date':'Arrival / end date';
            form.elements.endDate.required=stay;
            form.elements.time.parentElement.firstChild.textContent=stay?'Check-in time (optional)':'Start time (empty = flexible)';
            form.elements.endTime.parentElement.firstChild.textContent=stay?'Check-out time (optional)':'End time';
            if(form.elements.amount) form.elements.amount.parentElement.firstChild.textContent=stay?'Total stay amount (optional until paid)':'Amount (optional until paid)';
            const duration=stayDuration({category:'Accommodation',date:form.elements.date.value,endDate:form.elements.endDate.value});
            summary.textContent=duration ? `${duration} · Check-out day is not an overnight stay. Payment is the total for the entire stay, recorded once.` : 'Choose check-in and check-out dates.';
        }
        updateStayDuration();
        form.addEventListener('input',updateStayDuration);
        form.addEventListener('change',updateStayDuration);
        function renderLinks() {
            const host=dialog.querySelector('.link-rows'); if(!host)return;
            host.innerHTML=links.map((l,n)=>`<div class="plan-link-edit"><div class="form-grid"><label>Purpose<select data-link="${n}" data-field="purpose">${purposes.map(p=>`<option ${l.purpose===p?'selected':''}>${p}</option>`).join('')}</select></label><label>Display name<input data-link="${n}" data-field="label" maxlength="500" value="${escape(l.label)}"></label></div><label>URL<input type="url" required data-link="${n}" data-field="url" value="${escape(l.url)}"></label><small>${escape(platform(l.url))}</small> <button type="button" class="btn btn-secondary btn-sm" data-remove-link="${n}">Remove link</button></div>`).join('');
        }
        renderLinks();
        dialog.addEventListener('input',e=>{
            if(e.target.dataset.link!==undefined) links[Number(e.target.dataset.link)][e.target.dataset.field]=e.target.value;
            if(e.target.matches('.share-text')) dialog.querySelector('.link-preview').textContent=extract(e.target.value).map(u=>`${platform(u)} · ${u}`).join('\n') || 'Paste a valid HTTP or HTTPS URL.';
        });
        dialog.addEventListener('click',e=>{
            if(e.target.dataset.removeLink!==undefined) {links.splice(Number(e.target.dataset.removeLink),1);renderLinks();}
            if(e.target.matches('[data-import]')) { const field=dialog.querySelector('.share-text'); const found=extract(field.value); if(links.length+found.length>50){error.textContent='Keep at most 50 links.';return;} links.push(...found.map(url=>({url,purpose:'Other',label:''}))); field.value='';dialog.querySelector('.link-preview').textContent='';renderLinks(); }
        });
        form.querySelector('[name=category]')?.addEventListener('change', e => { if(['booking','activity'].includes(item.kind) && form.elements.expenseCategory) form.elements.expenseCategory.value=expenseCategory(e.target.value); });
        form.querySelector('[name=placeId]')?.addEventListener('change', e => {form.elements.expenseCategory.value=expenseCategory(items(s).find(p=>p.id===e.target.value)?.category);});
        form.onsubmit=e=>{
            e.preventDefault();
            try {
                const value={...item,...Object.fromEntries(new FormData(form)),links:structuredClone(links)};
                for(const k of Object.keys(value)) if(typeof value[k]==='string') value[k]=value[k].trim();
                if(!value.title && !value.placeId) throw new Error('Enter a name or select a saved place.');
                if(links.some(l=>!safeURL(l.url))) throw new Error('Links must be valid HTTP or HTTPS URLs.');
                if(value.kind==='booking' && value.category==='Accommodation' && (!value.endDate || value.endDate<=value.date)) throw new Error('Checkout must be after check-in.');
                if(value.kind==='activity' && value.date && (value.date<s.trip.start_date || value.date>s.trip.end_date)) throw new Error('Choose a day within this trip or leave it unassigned.');
                if(['booking','activity'].includes(value.kind)) {
                    value.currency = (value.currency || '').toUpperCase();
                    if(value.category==='No accommodation needed') value.paymentStatus='unpaid';
                    if(value.amount && (!Number.isFinite(Number(value.amount)) || Number(value.amount)<=0)) throw new Error('Enter a positive amount.');
                    if(value.amount && !/^[A-Z]{3}$/.test(value.currency)) throw new Error('Enter a three-letter currency.');
                    if(value.paymentStatus==='paid') {
                        if(!value.amount || !value.paidDate) throw new Error('Paid items need an amount and payment date.');
                        value.expenseClientId ||= id();
                    }
                    if(item.paymentStatus==='paid' && value.paymentStatus!=='paid' && !confirm('Remove the linked expense and keep this itinerary item unpaid?')) return;
                }
                if(value.kind==='destination'&&(!value.date||!value.endDate||value.endDate<value.date))throw new Error('Choose arrival and departure dates in order.');
                if(value.kind==='destination'&&(value.date<s.trip.start_date||value.endDate>s.trip.end_date))throw new Error('Destination dates must be within the trip dates.');
                if(value.kind!=='booking'||!['Flight','Train','Bus','Car rental'].includes(value.category))value.endDestinationId='';
                if(value.placeId) {value.address='';value.destinationId='';}
                for(const key of ['destinationId','endDestinationId'])if(value[key]&&!destinations(s).some(d=>d.id===value[key]))throw new Error('The linked destination was removed. Choose another destination.');
                change(s,list=>{if(value.placeId&&!list.some(p=>p.kind==='place'&&p.id===value.placeId))throw new Error('The linked place was removed. Choose another place.');const n=list.findIndex(i=>i.id===value.id);if(n<0)list.push(value);else list[n]=value;return list;});
                dialog.close();
            } catch(e) {error.textContent=e.message;}
        };
    }
    function create(kind,fields={}) { return {id:id(),kind,title:'',category:categories[kind]?.[0]||(kind==='destination'?'Destination':'Activity'),status:kind==='task'?'todo':'planned',priority:'Nice to have',links:[],...fields}; }
    async function handle(s,event) {
        const b=event.target.closest('button'); if(!b)return;
        try {
            if(b.dataset.tab){s.tab=b.dataset.tab;render(s);return;}
            const a=b.dataset.action, item=items(s).find(i=>i.id===b.dataset.id);
            if(a==='sync') await sync(s.trip.id);
            else if(a==='local'||a==='server') await resolve(s,a==='local');
            else if(a==='copy') await copy(b.dataset.url);
            else if(a?.startsWith('add-')) editor(s,create(a.slice(4),a==='add-destination'?{date:s.trip.start_date,endDate:s.trip.end_date}:['add-activity','add-booking','add-place'].includes(a)?{...(a==='add-place'?{}:{date:s.day||s.trip.start_date}),destinationId:s.destination|| (destinationsOn(s,s.day).length===1?destinationsOn(s,s.day)[0].id:'')}:{}));
            else if(a==='edit'&&item) editor(s,item);
            else if(a==='schedule'&&item) editor(s,create('activity',{placeId:item.id,date:s.day}));
            else if(a==='no-stay') editor(s,create('booking',{title:'No accommodation needed',category:'No accommodation needed',date:b.dataset.date,status:'confirmed'}));
            else if(a==='complete'&&item) change(s,list=>list.map(i=>i.id===item.id?{...i,status:i.status==='completed'?'todo':'completed'}:i));
            else if(a==='delete'&&item&&confirm(item.kind==='destination'?'Remove this destination? Places, bookings, activities and payments will be kept and unassigned.':item.kind==='place'?'Delete this place? Linked activities will be kept.':'Delete this item?')) change(s,list=>list.filter(i=>i.id!==item.id).map(i=>({...i,...(i.destinationId===item.id?{destinationId:''}:{}),...(i.endDestinationId===item.id?{endDestinationId:''}:{}),...(i.placeId===item.id?{placeId:'',title:i.title||item.title,destinationId:item.destinationId||''}:{})})));
            else if((a==='destination-up'||a==='destination-down')&&item){const ds=destinations(s),n=ds.findIndex(d=>d.id===item.id),to=n+(a==='destination-up'?-1:1);if(to>=0&&to<ds.length)change(s,list=>{ds.splice(to,0,ds.splice(n,1)[0]);let index=0;return list.map(i=>i.kind==='destination'?ds[index++]:i);});}
            else if((a==='up'||a==='down')&&item) {const day=kind(s,'activity').filter(i=>(i.date||'')===s.day), n=day.findIndex(i=>i.id===item.id), target=day[n+(a==='up'?-1:1)];if(target)reorder(s,item.id,target.id);}
        } catch(e) {showMessage(e.message,'error');}
    }
    function mount(el,trip,expenses=[],expenseCurrency='SGD') {
        let s=states.get(trip.id);
        if(!s) {s={trip,tab:'Overview',day:trip.start_date,category:'All',priority:'All',scheduled:'All',checklist:'All',destination:'',expenseFilter:'__all__',routeOpen:false};states.set(trip.id,s);}
        s.trip=trip; s.expenses=expenses; s.expenseCurrency=expenseCurrency;
        if(!el.querySelector(`#planner_${trip.id}`)) {
            el.innerHTML=`<div id="planner_${trip.id}"><p><a class="btn" href="/expenses/travel/trips/${trip.id}/plan/">Open shared itinerary · People & invitations ↗</a></p><div class="plan-status" role="status"></div><div class="plan-route"></div><nav class="plan-tabs" role="tablist" aria-label="Trip sections"></nav><div class="plan-panel"></div><div class="plan-expenses" id="tripExpenses_${trip.id}" hidden></div></div>`;
            const root=el.firstElementChild;s.root=root;
            root.addEventListener('click',e=>{if(!e.target.closest('.plan-expenses'))void handle(s,e);});
            root.addEventListener('change',e=>{if(e.target.matches('[data-expense-filter]')){s.expenseFilter=e.target.value;renderExpenseGroups(s);}if(e.target.dataset.filter){s[e.target.dataset.filter]=e.target.value;if(e.target.dataset.filter==='destination'){const d=destinations(s).find(d=>d.id===s.destination);if(d&&(s.day<d.date||s.day>d.endDate))s.day=d.date;}render(s);}});
            let dragged;
            root.addEventListener('dragstart',e=>{const card=e.target.closest('[draggable]');if(card){dragged=card.dataset.item;e.dataTransfer.setData('text/plain',dragged);}});
            root.addEventListener('dragover',e=>{if(e.target.closest('[draggable]'))e.preventDefault();});
            root.addEventListener('drop',e=>{const card=e.target.closest('[draggable]');if(card&&dragged){e.preventDefault();reorder(s,dragged,card.dataset.item);dragged=null;}});
        }
        render(s); void sync(trip.id);
        return document.getElementById(`tripExpenses_${trip.id}`);
    }
    async function editExpense(tripId, expenseId, attach=false, targetKind='booking') {
        const s=states.get(tripId), expense=s?.expenses.find(e=>e.id===expenseId);
        if(!s || !expense) return;
        try {
            const linkedId=linkedExpense(tripId,expenseId);
            if(linkedId) {
                if(!items(s).some(i=>i.id===linkedId)) await sync(tripId);
                const booking=items(s).find(i=>i.id===linkedId);
                if(!booking) throw new Error('Sync this trip to load its itinerary item.');
                editor(s,booking);
            } else if(attach) {
                const stay=expense.category==='Accommodation';
                const next=new Date(s.trip.start_date+'T12:00:00Z'); next.setUTCDate(next.getUTCDate()+1);
                editor(s,create(targetKind,{title:expense.name,notes:expense.notes,destinationId:expense.destination_id || '',category:targetKind==='activity'?'Activity':stay?'Accommodation':'Reservation',
                    date:s.trip.start_date, endDate:stay&&targetKind==='booking'?(s.trip.end_date>s.trip.start_date?s.trip.end_date:next.toISOString().slice(0,10)):'',
                    status:'confirmed',amount:String(expense.amount),currency:expense.currency,paymentStatus:'paid',paidDate:expense.date,
                    expenseCategory:expense.category,expenseClientId:expense.client_id || 'remote-'+expense.id}));
            }
        } catch(e) {showMessage(e.message,'error');}
    }
    function linkedExpense(tripId, expenseId) {
        const s=states.get(tripId), expense=s?.expenses.find(e=>e.id===expenseId);
        if(!expense) return null;
        return items(s).find(i=>i.expenseClientId && [expense.client_id,'remote-'+expense.id].includes(i.expenseClientId))?.id || expense.plan_item_id;
    }
    async function removePayment(tripId, expenseId) {
        const s=states.get(tripId), planItemId=linkedExpense(tripId,expenseId);
        if(!s || !planItemId) return;
        if(!confirm('Remove this payment and keep the itinerary item unpaid?')) return;
        if(!items(s).some(i=>i.id===planItemId)) await sync(tripId);
        if(!items(s).some(i=>i.id===planItemId)) {showMessage('Sync this trip to load its itinerary item.','error');return;}
        change(s,list=>list.map(i=>i.id===planItemId?{...i,paymentStatus:'unpaid'}:i));
    }
    function forget(tripId) { states.delete(tripId); localStorage.removeItem(key(tripId)); }
    window.addEventListener('online',()=>states.forEach(s=>void sync(s.trip.id)));
    window.addEventListener('storage',e=>states.forEach(s=>{if(e.key===key(s.trip.id))render(s);}));
    return {mount,refreshExpenses:tripId=>{const s=states.get(tripId);if(s)renderExpenseGroups(s);},forget,phase,safeURL,extract,platform,mapURL,editExpense,linkedExpense,removePayment};
})();
</script>
